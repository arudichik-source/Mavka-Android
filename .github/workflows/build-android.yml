name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore src/Mavka.Mobile/Mavka.Mobile.csproj

      - name: Build APK
        run: dotnet publish src/Mavka.Mobile/Mavka.Mobile.csproj -f net10.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mavka-Mobile-APK
          path: src/Mavka.Mobile/bin/Release/net10.0-android/publish/*.apk
