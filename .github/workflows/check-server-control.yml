name: Check MaVka Server Control

on:
  pull_request:
    paths:
      - 'control/**'
      - '.github/workflows/check-server-control.yml'
  push:
    branches: [main]
    paths:
      - 'control/**'
      - '.github/workflows/check-server-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run check-bundle
