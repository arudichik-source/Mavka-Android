name: Android Relay QA

on:
  push:
    branches:
      - feature/mobile-relay-20261019
      - feature/pc-mobile-bootstrap-access-20261019
    paths:
      - 'src/Mavka.Mobile/**'
      - 'DependencyVersions.props'
      - 'tools/MailPackageChecks/**'
      - 'tools/ProtectedPdfChecks/**'
      - 'tools/ProtectedXlsxChecks/**'
      - 'tools/RelayChecks/**'
      - 'tools/BootstrapChecks/**'
      - 'tools/relay-csharp-interop.mjs'
      - 'tools/smoke-relay-emulator.sh'
      - 'tools/relay-emulator-ui.py'
      - '.github/workflows/android-relay-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify integration ancestry and retained fixes
        run: bash tools/verify-stacked-integration.sh
      - name: Check Relay content parts, AES and two-way C# JavaScript signatures
        run: |
          dotnet run --project tools/RelayChecks -- export /tmp/relay-csharp.json
          node tools/relay-csharp-interop.mjs /tmp/relay-csharp.json /tmp/relay-node.json
          dotnet run --project tools/RelayChecks -- verify-node /tmp/relay-node.json
          dotnet run --project tools/BootstrapChecks -- tools/BootstrapChecks/synthetic-pc-fixture.json
      - name: Install Android workload
        run: dotnet workload install android
      - name: Audit all dependencies and verify protected file/mail compatibility
        run: |
          dotnet restore src/Mavka.Mobile/Mavka.Mobile.csproj
          dotnet list src/Mavka.Mobile/Mavka.Mobile.csproj package --vulnerable --include-transitive --no-restore --format json > /tmp/android-dependency-audit.json
          python3 -c 'import json; d=json.load(open("/tmp/android-dependency-audit.json")); assert not d.get("errors"), d; assert not any(f.get("topLevelPackages") or f.get("transitivePackages") for p in d["projects"] for f in p.get("frameworks", [])), d; print("PASS: no known vulnerable direct or transitive Android packages")'
          dotnet run --project tools/MailPackageChecks -c Release
          dotnet run --project tools/ProtectedPdfChecks -c Release
          dotnet run --project tools/ProtectedXlsxChecks -c Release
      - name: Save dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: Mavka-Dependency-Audit
          path: /tmp/android-dependency-audit.json
          if-no-files-found: error
      - name: Retain the isolated QA signing identity
        uses: actions/cache@v4
        with:
          path: ~/.mavka-qa-signing/registrationqa.jks
          key: mavka-registrationqa-test-signing-v1
      - name: Require the retained QA signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.mavka-qa-signing/registrationqa.jks" ]]; then
            echo 'Retained signing key is unavailable. Refusing an incompatible replacement installer.' >&2
            exit 1
          fi
      - name: Build isolated Relay QA APK
        run: |
          dotnet publish src/Mavka.Mobile/Mavka.Mobile.csproj \
            -f net10.0-android -c Release \
            -p:ApplicationId=ua.mavka.mobile.registrationqa \
            -p:ApplicationTitle="Mavka Registration Test" \
            -p:ApplicationVersion=2026102303 \
            -p:ApplicationDisplayVersion=1.3.2-gmail-qa \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$HOME/.mavka-qa-signing/registrationqa.jks" \
            -p:AndroidSigningKeyAlias=mavka-test-only \
            -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - name: Inspect package identity, signature and network permission
        shell: bash
        run: |
          set -euo pipefail
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for apk in src/Mavka.Mobile/bin/Release/net10.0-android/publish/*.apk; do
            "$aapt" dump badging "$apk" | grep -F "package: name='ua.mavka.mobile.registrationqa'"
            "$aapt" dump permissions "$apk" | grep -F 'android.permission.ACCESS_NETWORK_STATE'
            "$signer" verify --print-certs "$apk"
            cert="$("$signer" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | sort -u)"
            test "$cert" = '2410279934353190b0a4eb60e80c9df5d79502856a2838b85c0b7c1b72b266bd'
          done
      - name: Upload isolated installer
        uses: actions/upload-artifact@v4
        with:
          name: Mavka-Relay-QA-APK
          path: src/Mavka.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error

  emulator:
    needs: relay-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAVKA_QA_PACKAGE: ua.mavka.mobile.registrationqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mavka-Relay-QA-APK
          path: relay-qa-apk
      - name: Install synthetic QR smoke dependencies
        run: python3 -m pip install Pillow zxing-cpp
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch isolated Relay QA on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash tools/smoke-relay-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mavka-Relay-QA-Emulator-Evidence
          path: emulator-smoke-artifacts/
          if-no-files-found: ignore
